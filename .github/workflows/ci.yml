name: Action
on:
  push:
    branches:
      - main
jobs:
  ci:
    name: CI
    if: "!contains(github.event.head_commit.message, '[skip')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        if: "!contains(github.event.head_commit.message, '[skip-build')"
        run: npm run build
      - name: Verify sharp in deploy bundle
        if: "!contains(github.event.head_commit.message, '[skip-build')"
        run: |
          set -e
          test -f .output/server/node_modules/sharp/package.json
          grep -q '"sharp"' .output/server/package.json
          test -d .output/server/node_modules/@img/sharp-linux-x64
          cd .output/server
          node --input-type=module -e "import sharp from 'sharp'; await sharp({ create: { width: 2, height: 2, channels: 3, background: '#333' } }).png().toBuffer()"
      - name: Copy to server
        if: "!contains(github.event.head_commit.message, '[skip-build')"
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DEPLOY_SERVER_HOST }}
          username: ${{ secrets.DEPLOY_SERVER_USERNAME }}
          password: ${{ secrets.DEPLOY_SERVER_PASSWORD }}
          source: .output/*
          target: ${{ secrets.DEPLOY_SERVER_TARGET }}
      - name: Modify server
        if: "!contains(github.event.head_commit.message, '[skip-build')"
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_SERVER_HOST }}
          username: ${{ secrets.DEPLOY_SERVER_USERNAME }}
          password: ${{ secrets.DEPLOY_SERVER_PASSWORD }}
          script: |
            cd ${{ secrets.DEPLOY_SERVER_TARGET }}
            systemctl stop cookbook
            mv server server-old
            mv .output server
            systemctl start cookbook
            rm -rf server-old
